function uniqueValues(array){

return [...new Set(array)];

}


function fillSelect(select,values,firstText){

select.innerHTML =
<option value="">${firstText}</option> +

uniqueValues(values)
.sort()
.map(value =>
<option value="${value}">${value}</option>
)
.join("");

}

const filtered =
parts.filter(part => {

const text = [

part.brand,
part.model,
part.engine,
part.name,
part.ref

].join(" ").toLowerCase();


return (

(!brand || part.brand === brand) &&

(!model || part.model === model) &&

(!engine || part.engine === engine) &&

(!search || text.includes(search))

);

});


countNumber.textContent =
عدد النتائج: ${filtered.length} / ${parts.length} قطعة;


partsContainer.innerHTML = "";


filtered.forEach(part => {

const card =
document.createElement("article");

card.className = "card";


card.innerHTML = `

<span class="badge">
${part.brand}
</span>

<h3>
${part.name}
</h3>

<div class="line">
<b>السيارة:</b>
${part.model}
</div>

<div class="line">
<b>المحرك:</b>
${part.engine}
</div>

<div class="ref">
${part.ref || "غير محدد"}
</div>

`;


partsContainer.appendChild(card);

});

}


function resetFilters(){

brandSelect.value = "";

modelSelect.value = "";

engineSelect.value = "";

searchInput.value = "";

renderParts();

}


brandSelect.addEventListener(
"change",
renderParts
);

modelSelect.addEventListener(
"change",
renderParts
);

engineSelect.addEventListener(
"change",
renderParts
);

searchInput.addEventListener(
"input",
renderParts
);

resetButton.addEventListener(
"click",
resetFilters
);


initFilters();

renderParts();


</script>

</body>
</html>
