/* =====================================================
   عناصر الصفحة
===================================================== */

const productsBox = document.getElementById("products");
const search = document.getElementById("search");
const brandFilter = document.getElementById("brandFilter");
const carFilter = document.getElementById("carFilter");
const partFilter = document.getElementById("partFilter");
const count = document.getElementById("count");


/* =====================================================
   تجهيز السيارات والقطع في القوائم
===================================================== */

function populateFilters(){

    const cars = new Set();
    const parts = new Set();

    products.forEach(p => {

        p.cars.split("/").forEach(car=>{
            cars.add(car.trim());
        });

        parts.add(p.part);

    });

    [...cars]
    .sort()
    .forEach(car=>{

        const option=document.createElement("option");

        option.value=car;
        option.textContent=car;

        carFilter.appendChild(option);

    });

    [...parts]
    .sort()
    .forEach(part=>{

        const option=document.createElement("option");

        option.value=part;
        option.textContent=part;

        partFilter.appendChild(option);

    });
}


/* =====================================================
   عرض المنتجات
===================================================== */

function renderProducts(){

    const text=search.value.toLowerCase().trim();
    const brand=brandFilter.value;
    const car=carFilter.value;
    const part=partFilter.value;

    const filtered=products.filter(p=>{

        const fullText=(
            p.brand+" "+
            p.part+" "+
            p.ar+" "+
            p.fr+" "+
            p.maker+" "+
            p.cars
        ).toLowerCase();

        const matchText=!text || fullText.includes(text);

        const matchBrand=!brand || p.brand===brand;

        const matchCar=!car || p.cars.includes(car);

        const matchPart=!part || p.part===part;

        return matchText && matchBrand && matchCar && matchPart;

    });

    productsBox.innerHTML="";

    count.textContent=
        "عدد القطع: "+filtered.length+" / "+products.length;

    if(filtered.length===0){

        productsBox.innerHTML=`
            <div class="no-results">
                ❌ لم يتم العثور على قطعة مطابقة للبحث
                <br><br>
                جرّب اسم سيارة أو قطعة أخرى
            </div>
        `;

        return;
    }

    filtered.forEach((p,index)=>{

        const card=document.createElement("article");

        card.className="card";

        card.innerHTML=`

            <div class="image-wrap">

                <img
                    src="${p.image}"
                    alt="${p.ar}"
                    loading="lazy"
                    onerror="this.src='https://placehold.co/800x600/181818/ffffff?text=BK+AUTO'"
                >

                <div class="status">
                    ● متوفر
                </div>

            </div>

            <div class="card-body">

                <div class="category">
                    ${p.brand} • ${p.part}
                </div>

                <div class="name-ar">
                    ${p.ar}
                </div>

                <div class="name-fr">
                    ${p.fr}
                </div>

                <div class="brand">
                    العلامة: <strong>${p.maker}</strong>
                </div>

                <div class="compatible">
                    <strong>السيارات المتوافقة:</strong><br>
                    ${p.cars}
                </div>

            </div>
        `;

        productsBox.appendChild(card);

    });

}


/* =====================================================
   إعادة ضبط
===================================================== */

function resetFilters(){

    search.value="";
    brandFilter.value="";
    carFilter.value="";
    partFilter.value="";

    renderProducts();

}


/* =====================================================
   الأحداث
===================================================== */

search.addEventListener("input",renderProducts);

brandFilter.addEventListener("change",renderProducts);

carFilter.addEventListener("change",renderProducts);

partFilter.addEventListener("change",renderProducts);


/* =====================================================
   تشغيل الموقع
===================================================== */

populateFilters();
renderProducts();

</script>
