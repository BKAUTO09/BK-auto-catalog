<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BK AUTO | كتالوج قطع غيار السيارات</title>

<meta name="description"
content="BK AUTO - كتالوج قطع غيار السيارات Renault Peugeot Dacia في الجزائر">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #0b0b0b;
    color: #fff;
    min-height: 100vh;
}

/* ================= HEADER ================= */

header {
    background: linear-gradient(180deg, #171717, #0b0b0b);
    padding: 30px 20px 25px;
    text-align: center;
    border-bottom: 2px solid #e00020;
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: #e00020;
}

.subtitle {
    font-size: 18px;
    margin-top: 8px;
    color: #ddd;
}

.brands {
    color: #aaa;
    margin-top: 8px;
    font-size: 14px;
}

.phone {
    display: inline-block;
    margin-top: 18px;
    background: #e00020;
    color: white;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 5px 20px rgba(224,0,32,.25);
}

.phone:hover {
    background: #ff1738;
}

/* ================= CONTAINER ================= */

.container {
    width: 95%;
    max-width: 1400px;
    margin: auto;
}

/* ================= SEARCH ================= */

.search-area {
    padding: 25px 0 15px;
}

.search-box {
    width: 100%;
    padding: 17px 20px;
    background: #151515;
    border: 1px solid #444;
    border-radius: 12px;
    color: white;
    font-size: 17px;
    outline: none;
}

.search-box:focus {
    border-color: #e00020;
    box-shadow: 0 0 0 2px rgba(224,0,32,.15);
}

/* ================= FILTERS ================= */

.filters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #151515;
    color: white;
    font-size: 15px;
    outline: none;
}

select:focus {
    border-color: #e00020;
}

.reset-btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #e00020;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.reset-btn:hover {
    background: #ff1738;
}

/* ================= RESULT INFO ================= */

.result-info {
    padding: 15px 5px;
    color: #aaa;
}

.result-info strong {
    color: #e00020;
    font-size: 20px;
}

/* ================= PRODUCTS ================= */

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    padding-bottom: 40px;
}

.card {
    background: #151515;
    border: 1px solid #303030;
    border-radius: 15px;
    overflow: hidden;
    transition: .25s;
    position: relative;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #e00020;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
}

.image-container {
    width: 100%;
    height: 230px;
    background: #f5f5f5;
    position: relative;
    overflow: hidden;
}

.image-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: .3s;
}

.card:hover img {
    transform: scale(1.04);
}

.available {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #10b95c;
    color: white;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.unavailable {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #777;
    color: white;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.card-content {
    padding: 16px;
}

.part-ar {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 5px;
}

.part-fr {
    color: #bbb;
    font-size: 15px;
    margin-bottom: 14px;
}

.info-row {
    border-top: 1px solid #292929;
    padding: 9px 0;
    font-size: 14px;
    line-height: 1.5;
}

.label {
    color: #e00020;
    font-weight: bold;
}

.reference {
    direction: ltr;
    text-align: right;
    font-family: monospace;
    color: #fff;
}

.cars {
    color: #ddd;
}

.call-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    text-align: center;
    background: #e00020;
    color: white;
    text-decoration: none;
    border-radius: 9px;
    font-weight: bold;
}

.call-btn:hover {
    background: #ff1738;
}

/* ================= NO RESULT ================= */

.no-results {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
    font-size: 18px;
}

/* ================= FOOTER ================= */

footer {
    border-top: 1px solid #292929;
    background: #111;
    text-align: center;
    padding: 25px 15px;
    color: #aaa;
}

footer strong {
    color: #e00020;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 1100px) {
    .products {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 800px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 34px;
    }
}

@media (max-width: 520px) {
    .products {
        grid-template-columns: 1fr;
    }

    .image-container {
        height: 250px;
    }

    .logo {
        font-size: 30px;
    }

    .subtitle {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        BK <span>AUTO</span>
    </div>

    <div class="subtitle">
        كتالوج قطع غيار السيارات
    </div>

    <div class="brands">
        Renault • Peugeot • Dacia
    </div>

    <a class="phone" href="tel:0556419934">
        📞 0556419934
    </a>

</header>


<!-- ================= MAIN ================= -->

<main class="container">

    <!-- SEARCH -->

    <div class="search-area">

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="🔎 ابحث باسم القطعة، المرجع، السيارة أو العلامة..."
        >

    </div>


    <!-- FILTERS -->

    <div class="filters">

        <select id="brandFilter">

            <option value="">كل العلامات</option>

            <option value="RENAULT">
                Renault
            </option>

            <option value="PEUGEOT">
                Peugeot
            </option>

            <option value="DACIA">
                Dacia
            </option>

        </select>


        <select id="carFilter">

            <option value="">كل السيارات</option>

            <option value="CLIO">
                Clio
            </option>

            <option value="SYMBOL">
                Symbol
            </option>

            <option value="LOGAN">
                Logan
            </option>

            <option value="MEGANE">
                Mégane
            </option>

            <option value="KANGOO">
                Kangoo
            </option>

            <option value="PEUGEOT 207">
                Peugeot 207
            </option>

            <option value="PEUGEOT 208">
                Peugeot 208
            </option>

            <option value="PEUGEOT 301">
                Peugeot 301
            </option>

        </select>


        <select id="availabilityFilter">

            <option value="">
                كل القطع
            </option>

            <option value="yes">
                المتوفر فقط
            </option>

            <option value="no">
                غير متوفر
            </option>

        </select>

    </div>


    <button class="reset-btn" onclick="resetFilters()">
        ↻ إعادة ضبط البحث
    </button>


    <!-- RESULT -->

    <div class="result-info">
        عدد القطع:
        <strong id="count">0</strong>
    </div>


    <!-- PRODUCTS -->

    <div id="products" class="products"></div>

    <div id="noResults" class="no-results">
        ❌ لم يتم العثور على قطعة مطابقة للبحث.
    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    <strong>BK AUTO</strong>

    <br><br>

    قطع غيار السيارات

    <br>

    Renault • Peugeot • Dacia

    <br><br>

    📞 0556419934

</footer>


<script>

/* =========================================================
   بيانات قطع الغيار
   يمكنك إضافة قطع جديدة هنا
========================================================= */

const parts = [

    {
        ar: "مضخة ماء",
        fr: "Pompe à eau",
        brand: "RENAULT",
        reference: "PA1234",
        cars: "Clio 1.2 16V • Symbol 1.2 16V • Logan 1.4",
        carSearch: "CLIO SYMBOL LOGAN",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Pompe+%C3%A0+eau"
    },

    {
        ar: "طقم قابض",
        fr: "Kit embrayage",
        brand: "RENAULT",
        reference: "302052617R",
        cars: "Clio • Logan • Symbol",
        carSearch: "CLIO LOGAN SYMBOL",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Kit+Embrayage"
    },

    {
        ar: "سير الدينامو",
        fr: "Courroie alternateur",
        brand: "RENAULT",
        reference: "6PK1050",
        cars: "Clio • Symbol • Logan",
        carSearch: "CLIO SYMBOL LOGAN",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Courroie"
    },

    {
        ar: "رولمان العجلة الخلفية",
        fr: "Roulement arrière",
        brand: "RENAULT",
        reference: "SKF-R230",
        cars: "Logan • Mégane",
        carSearch: "LOGAN MEGANE",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Roulement"
    },

    {
        ar: "جوان كارتير الزيت",
        fr: "Joint carter d'huile",
        brand: "RENAULT",
        reference: "ELRING-001",
        cars: "Clio 1.4 • Symbol 1.4",
        carSearch: "CLIO SYMBOL",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Joint+Carter"
    },

    {
        ar: "جوان صبابات",
        fr: "Joint couvre-culasse",
        brand: "PEUGEOT",
        reference: "PSA-123456",
        cars: "Peugeot 207 • Peugeot 208",
        carSearch: "PEUGEOT 207 PEUGEOT 208",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Joint"
    },

    {
        ar: "طقم فرامل أمامي",
        fr: "Plaquettes de frein avant",
        brand: "PEUGEOT",
        reference: "PA803",
        cars: "Peugeot 301 • Peugeot 208",
        carSearch: "PEUGEOT 301 PEUGEOT 208",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Plaquettes"
    },

    {
        ar: "مضخة مساعدة التوجيه",
        fr: "Pompe de direction assistée",
        brand: "RENAULT",
        reference: "R218",
        cars: "Logan 1.6 • Symbol",
        carSearch: "LOGAN SYMBOL",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Pompe+Direction"
    },

    {
        ar: "فلتر زيت",
        fr: "Filtre à huile",
        brand: "DACIA",
        reference: "DAC-001",
        cars: "Logan • Sandero • Duster",
        carSearch: "LOGAN",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Filtre+Huile"
    },

    {
        ar: "فلتر هواء",
        fr: "Filtre à air",
        brand: "RENAULT",
        reference: "AIR-001",
        cars: "Clio • Kangoo • Symbol",
        carSearch: "CLIO KANGOO SYMBOL",
        available: true,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Filtre+Air"
    },

    {
        ar: "جوان سباي عمود الكامات",
        fr: "Joint spi arbre à cames",
        brand: "RENAULT",
        reference: "80.105.8",
        cars: "Kangoo 1.9D",
        carSearch: "KANGOO",
        available: false,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Joint+SPI"
    },

    {
        ar: "جوان سباي عمود المرفق",
        fr: "Joint spi vilebrequin",
        brand: "RENAULT",
        reference: "JS-1.2-16V",
        cars: "Clio 1.2 16V • Symbol 1.2 16V",
        carSearch: "CLIO SYMBOL",
        available: false,
        image: "https://placehold.co/700x500/f5f5f5/222?text=Joint+Vilebrequin"
    }

];


/* =========================================================
   عرض القطع
========================================================= */

const productsContainer =
    document.getElementById("products");

const countElement =
    document.getElementById("count");

const noResults =
    document.getElementById("noResults");


function displayParts() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const brand =
        document
        .getElementById("brandFilter")
        .value;

    const car =
        document
        .getElementById("carFilter")
        .value;

    const availability =
        document
        .getElementById("availabilityFilter")
        .value;


    const filteredParts = parts.filter(part => {

        const text = (

            part.ar + " " +
            part.fr + " " +
            part.brand + " " +
            part.reference + " " +
            part.cars + " " +
            part.carSearch

        ).toLowerCase();


        const searchMatch =
            !search || text.includes(search);


        const brandMatch =
            !brand || part.brand === brand;


        const carMatch =
            !car ||
            part.carSearch
            .toUpperCase()
            .includes(car);


        const availabilityMatch =
            !availability ||
            (availability === "yes" && part.available) ||
            (availability === "no" && !part.available);


        return (
            searchMatch &&
            brandMatch &&
            carMatch &&
            availabilityMatch
        );

    });


    productsContainer.innerHTML = "";


    countElement.textContent =
        filteredParts.length;


    if (filteredParts.length === 0) {

        noResults.style.display = "block";

        return;

    }


    noResults.style.display = "none";


    filteredParts.forEach(part => {

        const card =
            document.createElement("div");

        card.className = "card";


        const statusClass =
            part.available
            ? "available"
            : "unavailable";


        const statusText =
            part.available
            ? "● متوفر"
            : "غير متوفر";


        card.innerHTML = `

            <div class="image-container">

                <img
                    src="${part.image}"
                    alt="${part.fr}"
                    loading="lazy"
                    onerror="this.src='https://placehold.co/700x500/f5f5f5/222?text=BK+AUTO'"
                >

                <div class="${statusClass}">
                    ${statusText}
                </div>

            </div>


            <div class="card-content">

                <div class="part-ar">
                    ${part.ar}
                </div>

                <div class="part-fr">
                    ${part.fr}
                </div>


                <div class="info-row">

                    <span class="label">
                        العلامة:
                    </span>

                    ${part.brand}

                </div>


                <div class="info-row">

                    <span class="label">
                        المرجع:
                    </span>

                    <span class="reference">
                        ${part.reference}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        السيارات المتوافقة:
                    </span>

                    <div class="cars">
                        ${part.cars}
                    </div>

                </div>


                <a
                    class="call-btn"
                    href="tel:0556419934"
                >
                    📞 اتصل للطلب
                </a>

            </div>

        `;


        productsContainer.appendChild(card);

    });

}


/* =========================================================
   إعادة ضبط البحث
========================================================= */

function resetFilters() {

    document.getElementById("search").value = "";

    document.getElementById("brandFilter").value = "";

    document.getElementById("carFilter").value = "";

    document.getElementById("availabilityFilter").value = "";

    displayParts();

}


/* =========================================================
   البحث المباشر
========================================================= */

document
.getElementById("search")
.addEventListener("input", displayParts);


document
.getElementById("brandFilter")
.addEventListener("change", displayParts);


document
.getElementById("carFilter")
.addEventListener("change", displayParts);


document
.getElementById("availabilityFilter")
.addEventListener("change", displayParts);


/* =========================================================
   تشغيل الكتالوج
========================================================= */

displayParts();

</script>

</body>
</html>
