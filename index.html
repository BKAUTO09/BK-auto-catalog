        select {
            font-family: inherit;
        }

           HEADER
        ========================= */

            background:

                    #0b0b0b,

            text-align: center;

            border-bottom: 2px solid #e30613;

            position: relative;
        }

        .logo {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 1px;

        }

        }

        .logo .auto {
            color: #e30613;
        }

        .subtitle {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .brands {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .phone-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            background: #e30613;
            color: white;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 10px;

            font-size: 18px;
            font-weight: bold;

            transition: 0.25s;
        }

        .phone-button:hover {
            background: #ff1b28;
            transform: translateY(-2px);
        }


        /* =========================
           SEARCH AREA
        ========================= */

        .search-section {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .search-box {
            width: 100%;

            background: #191919;

            border: 1px solid #333;

            border-radius: 12px;

            padding: 15px 18px;

            color: white;

            font-size: 17px;

            outline: none;

            transition: 0.2s;
        }

        .search-box:focus {
            border-color: #e30613;
            box-shadow:
                0 0 0 2px rgba(227, 6, 19, 0.15);
        }


        /* =========================
           FILTERS
        ========================= */

        .filters {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 15px;
        }

        .filter {
            width: 100%;

            background: #191919;

            color: white;

            border: 1px solid #333;

            border-radius: 10px;

            padding: 13px;

            font-size: 15px;

            outline: none;
        }

        .filter:focus {
            border-color: #e30613;
        }

        .reset-button {
            width: 100%;

            margin-top: 12px;

            background: transparent;

            color: white;

            border: 1px solid #e30613;

            border-radius: 10px;

            padding: 12px;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s;
        }

        .reset-button:hover {
            background: #e30613;
        }


        /* =========================
           RESULT INFO
        ========================= */

        .result-info {
            max-width: 1200px;

            margin: 25px auto 10px;

            padding: 0 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        .result-count {
            color: #e30613;

            font-weight: bold;

            font-size: 16px;
        }

        .availability-info {
            color: #aaaaaa;

            font-size: 14px;
        }


        /* =========================
           PRODUCTS GRID
        ========================= */

        .products {

            max-width: 1200px;

            margin: 0 auto;

            padding: 10px 20px 50px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {

            background: #1b1b1b;

            border: 1px solid #303030;

            border-radius: 14px;

            overflow: hidden;

            position: relative;

            transition:
                transform 0.25s,
                border-color 0.25s,
                box-shadow 0.25s;
        }

        .product-card:hover {

            transform: translateY(-5px);

            border-color: #e30613;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);
        }


        /* =========================
           IMAGE
        ========================= */

        .product-image {

            width: 100%;

            height: 210px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }

        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            transition: transform 0.3s;
        }

        .product-card:hover
        .product-image img {

            transform: scale(1.05);
        }


        /* =========================
           STATUS
        ========================= */

        .status {

            position: absolute;

            top: 10px;

            right: 10px;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            z-index: 2;
        }

        .available {

            background: #159447;

            color: white;
        }

        .unavailable {

            background: #555555;

            color: white;
        }

           CARD CONTENT
        ========================= */

            padding: 15px;
        }

        .product-name-fr {

            font-size: 18px;

            font-weight: bold;

            color: #ffffff;

            margin-bottom: 3px;
        }

        .product-name-ar {

            font-size: 15px;

            color: #bbbbbb;

            margin-bottom: 10px;
        }

        .brand {

            border: 1px solid #444;

            padding: 4px 9px;

            border-radius: 6px;

            font-size: 12px;

        }

        ========================= */

            text-align: center;

            padding: 60px 20px;

            color: #999999;

            font-size: 18px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

            overflow-y: auto;

            background: #1b1b1b;

            border: 1px solid #444;

            border-radius: 15px;

            position: relative;

            padding: 20px;
        }

        .close {

            top: 10px;

            left: 15px;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            border: none;

            background: #e30613;

            color: white;

            font-size: 22px;

            cursor: pointer;

        }

        .modal-image {

/* =====================================================
   إنشاء الفلاتر تلقائياً
===================================================== */

function createFilters() {

    const brands = [
        ...new Set(
            products.map(
                product => product.brand
            )
        )
    ];

    const cars = [
        ...new Set(
            products.flatMap(
                product =>
                    product.cars
                        .split(",")
                        .map(car => car.trim())
            )
        )
    ];

    const engines = [
        ...new Set(
            products.map(
                product => product.engine
            )
        )
    ];


    brands.sort();

    cars.sort();

    engines.sort();


    brands.forEach(brand => {

        const option =
            document.createElement("option");

        option.value = brand;

        option.textContent = brand;

        brandFilter.appendChild(option);

    });


    cars.forEach(car => {

        const option =
            document.createElement("option");

        option.value = car;

        option.textContent = car;

        carFilter.appendChild(option);

    });


    engines.forEach(engine => {

        const option =
            document.createElement("option");

        option.value = engine;

        option.textContent = engine;

        engineFilter.appendChild(option);

    });

}


/* =====================================================
   عرض المنتجات
===================================================== */

function displayProducts(list) {

    productsContainer.innerHTML = "";


    resultCount.textContent =
        "عدد القطع: " + list.length;


    if (list.length === 0) {

        productsContainer.innerHTML = `

            <div class="no-results">

                🔍 لا توجد قطع مطابقة للبحث

                <br><br>

                جرّب تغيير السيارة أو المحرك
                أو اسم القطعة.

            </div>

        `;

        return;
    }


    list.forEach(product => {

        const card =
            document.createElement("article");

        card.className =
            "product-card";


        const statusClass =
            product.available
                ? "available"
                : "unavailable";


        const statusText =
            product.available
                ? "🟢 متوفر"
                : "⚫ غير متوفر";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.nameFr}"
                    loading="lazy"
                    onerror="this.src='https://via.placeholder.com/800x500?text=BK+AUTO'"
                >

            </div>


            <div
                class="status ${statusClass}"
            >
                ${statusText}
            </div>


            <div class="product-content">

                <div class="product-name-fr">
                    ${product.nameFr}
                </div>

                <div class="product-name-ar">
                    ${product.nameAr}
                </div>


                <div class="brand">
                    🏷️ ${product.brand}
                </div>


                <div class="reference">
                    Réf: ${product.reference}
                </div>


                <div class="compatibility">

                    <div class="compatibility-title">
                        🚗 السيارات والمحرك
                    </div>

                    <div class="compatibility-text">
                        ${product.cars}
                        <br>
                        ⚙️ ${product.engine}
                    </div>

                </div>


                <button
                    class="details-button"
                    onclick="openProduct(${product.id})"
                >
                    عرض تفاصيل القطعة
                </button>

            </div>

        `;


        productsContainer.appendChild(card);

    });

}


/* =====================================================
   فتح تفاصيل القطعة
===================================================== */

function openProduct(id) {

    const product =
        products.find(
            item => item.id === id
        );


    if (!product) {
        return;
    }


    modalImage.src =
        product.image;

    modalImage.alt =
        product.nameFr;


    modalNameFr.textContent =
        product.nameFr;


    modalNameAr.textContent =
        product.nameAr;


    modalBrand.textContent =
        product.brand;


    modalReference.textContent =
        product.reference;


    modalCars.textContent =
        product.cars;


    modalEngine.textContent =
        product.engine;


    modalAvailability.textContent =
        product.available
            ? "🟢 متوفر"
            : "⚫ غير متوفر";


    modal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";
}


/* =====================================================
   إغلاق النافذة
===================================================== */

function closeProductModal() {

    modal.classList.remove(
        "show"
    );

    document.body.style.overflow =
        "";
}


closeModal.addEventListener(
    "click",
    closeProductModal
);


modal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === modal
        ) {

            closeProductModal();

        }

    }
);


/* =====================================================
   البحث والفلاتر
===================================================== */

function filterProducts() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const brand =
        brandFilter.value
            .toLowerCase();


    const car =
        carFilter.value
            .toLowerCase();


    const engine =
        engineFilter.value
            .toLowerCase();


    const filtered =
        products.filter(product => {

            const searchText = (

                product.nameFr +
                " " +
                product.nameAr +
                " " +
                product.brand +
                " " +
                product.reference +
                " " +
                product.cars +
                " " +
                product.engine

            ).toLowerCase();


            const searchMatch =
                search === "" ||
                searchText.includes(search);


            const brandMatch =
                brand === "" ||
                product.brand.toLowerCase()
                    === brand;


            const carMatch =
                car === "" ||
                product.cars
                    .toLowerCase()
                    .includes(car);


            const engineMatch =
                engine === "" ||
                product.engine
                    .toLowerCase()
                    .includes(engine);


            return (
                searchMatch &&
                brandMatch &&
                carMatch &&
                engineMatch
            );

        });


    displayProducts(filtered);

}


/* =====================================================
   أحداث البحث
===================================================== */

searchInput.addEventListener(
    "input",
    filterProducts
);


brandFilter.addEventListener(
    "change",
    filterProducts
);


carFilter.addEventListener(
    "change",
    filterProducts
);


engineFilter.addEventListener(
    "change",
    filterProducts
);


/* =====================================================
   إعادة ضبط
===================================================== */

resetButton.addEventListener(
    "click",
    function() {

        searchInput.value = "";

        brandFilter.value = "";

        carFilter.value = "";

        engineFilter.value = "";

        displayProducts(products);

    }
);


/* =====================================================
   ESC لإغلاق النافذة
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeProductModal();

        }

    }
);


/* =====================================================
   تشغيل الموقع
===================================================== */

createFilters();

displayProducts(products);

</script>

</body>
</html>
