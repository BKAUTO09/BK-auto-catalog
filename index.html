/* =========================
   BUILD FILTERS
========================= */

const carFilter = document.getElementById("carFilter");
const typeFilter = document.getElementById("typeFilter");

const cars = new Set();
const types = new Set();

parts.forEach(part => {

    part.cars.split("•").forEach(car=>{
        cars.add(car.trim());
    });

    types.add(part.type);

});


[...cars]
.sort()
.forEach(car=>{

    const option=document.createElement("option");

    option.value=car;
    option.textContent=car;

    carFilter.appendChild(option);

});


[...types]
.sort()
.forEach(type=>{

    const option=document.createElement("option");

    option.value=type;
    option.textContent=type;

    typeFilter.appendChild(option);

});


/* =========================
   DISPLAY
========================= */

const catalog=document.getElementById("catalog");
const empty=document.getElementById("empty");
const count=document.getElementById("count");

function displayParts(){

    const search=document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const brand=document
        .getElementById("brandFilter")
        .value;

    const car=document
        .getElementById("carFilter")
        .value;

    const type=document
        .getElementById("typeFilter")
        .value;


    const filtered=parts.filter(part=>{

        const text=(
            part.fr+" "+
            part.ar+" "+
            part.brand+" "+
            part.maker+" "+
            part.cars+" "+
            part.type
        ).toLowerCase();


        const searchOK=
            !search ||
            text.includes(search);


        const brandOK=
            !brand ||
            part.brand===brand;


        const carOK=
            !car ||
            part.cars
                .split("•")
                .map(x=>x.trim())
                .includes(car);


        const typeOK=
            !type ||
            part.type===type;


        return searchOK &&
               brandOK &&
               carOK &&
               typeOK;

    });


    catalog.innerHTML="";


    filtered.forEach((part,index)=>{

        const card=document.createElement("article");

        card.className="card";


        card.innerHTML=`

            <div class="image-box">

                <span class="status">
                    ● متوفر
                </span>

                <img
                    src="${part.image}"
                    alt="${part.fr} - ${part.ar}"
                    loading="lazy"
                    onerror="this.src='https://placehold.co/800x600/151515/ffffff?text=BK+AUTO'"
                >

            </div>


            <div class="content">

                <div class="part-type">
                    ${part.type}
                </div>


                <div class="part-name-fr">
                    ${part.fr}
                </div>


                <div class="part-name-ar">
                    ${part.ar}
                </div>


                <span class="brand">
                    🏷️ ${part.maker}
                </span>


                <div class="compatible">

                    <div class="compatible-title">
                        🚗 السيارات المتوافقة:
                    </div>

                    <div class="cars">
                        ${part.cars}
                    </div>

                </div>


                <a
                    class="call-btn"
                    href="tel:0556419934"
                >
                    📞 اتصل للاستفسار
                </a>

            </div>

        `;


        catalog.appendChild(card);

    });


    count.textContent=
        filtered.length+" قطعة";


    empty.style.display=
        filtered.length===0
        ?"block"
        :"none";

}


/* =========================
   RESET
========================= */

function resetFilters(){

    document.getElementById("search").value="";
    document.getElementById("brandFilter").value="";
    document.getElementById("carFilter").value="";
    document.getElementById("typeFilter").value="";

    displayParts();

}


/* =========================
   EVENTS
========================= */

document
.getElementById("search")
.addEventListener("input",displayParts);

document
.getElementById("brandFilter")
.addEventListener("change",displayParts);

document
.getElementById("carFilter")
.addEventListener("change",displayParts);

document
.getElementById("typeFilter")
.addEventListener("change",displayParts);


/* =========================
   START
========================= */

displayParts();
