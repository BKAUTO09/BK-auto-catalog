<style>

/* =========================
   RESET
========================= */

*{

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Tahoma,sans-serif;

    color:#fff;

}

/* =========================
   HEADER
========================= */

header{
    background:

    padding:35px 15px 30px;
    border-bottom:2px solid #e50914;
}

.logo{
    font-size:42px;

}

.logo .bk{

}

.logo .auto{

}

.subtitle{
    margin-top:8px;
    font-size:20px;
    font-weight:bold;
}

.brands{
    color:#aaa;
    margin-top:8px;
    font-size:15px;
}

.phone{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:18px;
    background:#e50914;
    color:white;
    padding:13px 28px;
    border-radius:9px;
    text-decoration:none;
    font-size:19px;
    font-weight:bold;
    box-shadow:0 5px 20px rgba(229,9,20,.3);
    transition:.2s;
}

.phone:hover{
    background:#ff1c27;
    transform:translateY(-2px);
}

/* =========================
   CONTAINER
========================= */

.container{
    width:min(1400px,94%);
    margin:auto;
}

/* =========================
   SEARCH AREA
========================= */

.search-area{
    margin:25px auto;
    padding:22px;
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
}

.search-title{
    text-align:right;
    color:#ddd;
    margin-bottom:15px;
    font-size:16px;
}

.search-box{
    width:100%;
    padding:16px 18px;
    border-radius:10px;
    border:1px solid #444;
    background:#050505;
    color:#fff;
    font-size:16px;
    outline:none;
    transition:.2s;
}

.search-box:focus{
    border-color:#e50914;
    box-shadow:0 0 0 2px rgba(229,9,20,.12);
}

.filters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:15px;
}

select{
    width:100%;
    padding:14px;
    background:#090909;
    border:1px solid #444;
    border-radius:9px;
    color:white;
    font-size:15px;
    outline:none;
}

select:focus{
    border-color:#e50914;
}

.reset-btn{
    width:100%;
    margin-top:15px;
    border:0;
    background:#e50914;
    color:white;
    padding:14px;
    border-radius:9px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.2s;
}

.reset-btn:hover{
    background:#ff1b26;
}

/* =========================
   RESULTS INFO
========================= */

.results-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 15px;
    gap:10px;
}

.results-count{
    color:#e50914;
    font-weight:bold;
    font-size:18px;
}

.available-info{
    color:#aaa;
    font-size:14px;
}

/* =========================
   PRODUCTS GRID
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    padding-bottom:50px;
}

/* =========================
   CARD
========================= */

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    transition:.25s;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.card:hover{
    transform:translateY(-5px);
    border-color:#e50914;
    box-shadow:0 10px 30px rgba(229,9,20,.15);
}

.image-box{
    height:210px;
    background:#eee;
    position:relative;
    overflow:hidden;
}

.image-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.35s;
}

.card:hover .image-box img{
    transform:scale(1.04);
}

.available{
    position:absolute;
    top:12px;
    right:12px;
    background:#16c766;
    color:#fff;
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
}

.card-body{
    padding:16px;
}

.part-fr{
    font-size:19px;
    font-weight:800;
    margin-bottom:5px;
}

.part-ar{
    font-size:16px;
    color:#bbb;
    margin-bottom:14px;
}

.info-row{
    margin:8px 0;
    color:#ddd;
    font-size:14px;
    line-height:1.5;
}

.info-label{
    color:#888;
}

.brand{
    display:inline-block;
    background:#242424;
    border:1px solid #444;
    padding:5px 9px;
    border-radius:6px;
    color:#fff;
    font-weight:bold;
    margin-top:3px;
}

.cars{
    color:#eee;
}

.contact-btn{
    display:block;
    text-align:center;
    background:#e50914;
    color:white;
    text-decoration:none;
    padding:11px;
    border-radius:8px;
    margin-top:15px;
    font-weight:bold;
    transition:.2s;
}

.contact-btn:hover{
    background:#ff1c27;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;
    background:#151515;
    border:1px dashed #444;
    border-radius:12px;
    text-align:center;
    padding:50px 20px;
    color:#aaa;
}

.empty-icon{
    font-size:40px;
    margin-bottom:12px;

/* =========================
   FOOTER
========================= */

footer{
    border-top:1px solid #292929;
    background:#050505;
    padding:30px 15px;
    text-align:center;
    color:#999;

.footer-logo{

.footer-logo span{

.footer-phone{

/* =========================
   FLOATING PHONE
========================= */

.floating-phone{
    position:fixed;
    bottom:20px;
    left:20px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#16c766;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:25px;
    z-index:999;
    box-shadow:0 5px 20px rgba(0,0,0,.5);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    .products{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:800px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:34px;

}

@media(max-width:520px){

    .products{
        grid-template-columns:1fr;
    }

    .image-box{
        height:230px;
    }

    .results-info{
        flex-direction:column;
        align-items:flex-start;
    }

    .subtitle{
        font-size:17px;
    }

    .brands{
        font-size:13px;
    }

}

/* =========================
   ANIMATION
========================= */

.card{
    animation:fadeIn .35s ease both;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

<script>

        ],

        type:"Suspension",

        image:
        "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=900&q=85"
    }

];


/* =========================================================
   عناصر الصفحة
========================================================= */

const productsContainer =
    document.getElementById("products");

const searchInput =
    document.getElementById("search");

const brandFilter =
    document.getElementById("brandFilter");

const carFilter =
    document.getElementById("carFilter");

const partFilter =
    document.getElementById("partFilter");

const countElement =
    document.getElementById("count");


/* =========================================================
   تجهيز الفلاتر تلقائيا
========================================================= */

function setupFilters(){

    const brands = [
        ...new Set(
            products.map(product => product.brand)
        )
    ].sort();

    const cars = [
        ...new Set(
            products.flatMap(product => product.cars)
        )
    ].sort();

    const parts = [
        ...new Set(
            products.map(product => product.type)
        )
    ].sort();


    brands.forEach(brand => {

        const option =
            document.createElement("option");

        option.value = brand;
        option.textContent = brand;

        brandFilter.appendChild(option);

    });


    cars.forEach(car => {

        const option =
            document.createElement("option");

        option.value = car;
        option.textContent = car;

        carFilter.appendChild(option);

    });


    parts.forEach(part => {

        const option =
            document.createElement("option");

        option.value = part;
        option.textContent = part;

        partFilter.appendChild(option);

    });

}


/* =========================================================
   عرض القطع
========================================================= */

function renderProducts(){

    const search =
        searchInput.value
        .trim()
        .toLowerCase();

    const selectedBrand =
        brandFilter.value;

    const selectedCar =
        carFilter.value;

    const selectedPart =
        partFilter.value;


    const filtered =
        products.filter(product => {

            const searchableText = [

                product.fr,

                product.ar,

                product.brand,

                product.type,

                ...product.cars

            ]
            .join(" ")
            .toLowerCase();


            const matchesSearch =
                !search ||
                searchableText.includes(search);


            const matchesBrand =
                !selectedBrand ||
                product.brand === selectedBrand;


            const matchesCar =
                !selectedCar ||
                product.cars.includes(selectedCar);


            const matchesPart =
                !selectedPart ||
                product.type === selectedPart;


            return (
                matchesSearch &&
                matchesBrand &&
                matchesCar &&
                matchesPart
            );

        });


    countElement.textContent =
        filtered.length;


    if(filtered.length === 0){

        productsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    لم يتم العثور على القطعة
                </h3>

                <p style="margin-top:10px;">
                    جرّب البحث باسم آخر أو اختر "كل القطع".
                </p>

            </div>

        `;

        return;

    }


    productsContainer.innerHTML =
        filtered.map(product => createCard(product)).join("");

}


/* =========================================================
   إنشاء بطاقة القطعة
========================================================= */

function createCard(product){

    const cars =
        product.cars.join(" • ");


    return `

        <article class="card">

            <div class="image-box">

                <img
                    src="${product.image}"
                    alt="${product.fr} - ${product.ar}"
                    loading="lazy"
                    onerror="this.src='https://images.unsplash.com/photo-1487754180451-c456f719a1fc?auto=format&fit=crop&w=900&q=85'"
                >

                <span class="available">
                    ● متوفر
                </span>

            </div>


            <div class="card-body">

                <div class="part-fr">
                    ${product.fr}
                </div>

                <div class="part-ar">
                    ${product.ar}
                </div>


                <div class="info-row">

                    <span class="info-label">
                        العلامة:
                    </span>

                    <br>

                    <span class="brand">
                        ${product.brand}
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        السيارات المتوافقة:
                    </span>

                    <div class="cars">
                        ${cars}
                    </div>

                </div>


                <a
                    class="contact-btn"
                    href="tel:0556419934">

                    📞 اتصل للاستفسار

                </a>

            </div>

        </article>

    `;

}


/* =========================================================
   إعادة ضبط
========================================================= */

function resetFilters(){

    searchInput.value = "";

    brandFilter.value = "";

    carFilter.value = "";

    partFilter.value = "";

    renderProducts();

}


/* =========================================================
   الأحداث
========================================================= */

searchInput.addEventListener(
    "input",
    renderProducts
);

brandFilter.addEventListener(
    "change",
    renderProducts
);

carFilter.addEventListener(
    "change",
    renderProducts
);

partFilter.addEventListener(
    "change",
    renderProducts
);


/* =========================================================
   تشغيل الموقع
========================================================= */

setupFilters();

renderProducts();

</script>
