html = r'''<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BK AUTO | كتالوج قطع الغيار</title>
<style>
:root{--bg:#0b0d10;--panel:#15191e;--line:#2a3139;--text:#f4f5f7;--muted:#aeb5bd;--red:#e53935;--green:#25d366}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
header{position:sticky;top:0;z-index:10;background:#0b0d10ee;border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900}.logo span{color:var(--red)}nav{display:flex;gap:22px}nav a{color:#ddd;text-decoration:none}
.hero{text-align:center;padding:55px 20px 35px;background:radial-gradient(circle at 50% 0,#252b33,#0b0d10 55%)}
.hero h1{font-size:42px;margin:10px}.hero h1 span{color:var(--red)}.hero p{color:var(--muted)}
.searchbox{max-width:1100px;margin:25px auto 0;background:#f7f4ed;border-radius:18px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:white}
.actions{display:flex;gap:10px;margin-top:10px}.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:bold;cursor:pointer}.search{background:var(--red);color:white}.reset{background:#353b42;color:white}
main{max-width:1200px;margin:35px auto;padding:0 20px}.title{display:flex;justify-content:space-between;margin-bottom:18px}.count{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.badge{display:inline-block;background:#302020;color:#ffb2ac;border-radius:20px;padding:5px 10px;font-size:12px}
.card h3{margin:10px 0}.meta{color:var(--muted);line-height:1.7}.ref{margin:14px 0;padding:12px;background:#1d232a;border-radius:10px;direction:ltr;text-align:left;font-family:monospace}
.whatsapp{display:block;text-align:center;background:var(--green);color:#07120a;padding:12px;border-radius:10px;font-weight:800;text-decoration:none}
.empty{text-align:center;color:var(--muted);padding:50px;background:var(--panel);border-radius:16px}
footer{text-align:center;border-top:1px solid var(--line);padding:30px;color:var(--muted);margin-top:50px}
@media(max-width:850px){.grid,.cards{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.cards{grid-template-columns:1fr}.hero h1{font-size:30px}nav{gap:10px;font-size:13px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">BK <span>AUTO</span></div><nav><a href="#home">الرئيسية</a><a href="#catalog">الكتالوج</a><a href="#contact">اتصل بنا</a></nav></div></header>

<section class="hero" id="home">
<h1>BK <span>AUTO</span></h1>
<p>كتالوج قطع غيار Renault & Peugeot — ابحث بالسيارة أو المحرك أو القطعة أو المرجع</p>
<div class="searchbox">
<div class="grid">
<select id="brand"><option value="">كل الماركات</option><option>Renault</option><option>Peugeot</option></select>
<select id="car"><option value="">كل السيارات</option></select>
<select id="engine"><option value="">كل المحركات</option></select>
<input id="q" placeholder="اسم القطعة أو رقم المرجع...">
</div>
<div class="actions"><button class="btn search" onclick="render()">بحث</button><button class="btn reset" onclick="resetAll()">إعادة ضبط</button></div>
</div></section>

<main id="catalog"><div class="title"><h2>كتالوج قطع الغيار</h2><div class="count" id="count"></div></div><div class="cards" id="results"></div></main>

<footer id="contact"><b>BK AUTO</b><br>Renault & Peugeot Spare Parts<br>ضع رقم WhatsApp الحقيقي في المتغير WHATSAPP_NUMBER داخل الكود.</footer>

<script>
/* ضع رقم WhatsApp بصيغة دولية بدون + أو مسافات */
const WHATSAPP_NUMBER="213556419934";

const vehicles=[
["Renault","Clio 2",["1.2 16V","1.4 16V","1.5 dCi","1.9 d"]],
["Renault","Clio 3",["1.2 16V","1.4 16V","1.5 dCi","1.6 16V"]],
["Renault","Clio 4",["0.9 TCe","1.2 16V","1.2 TCe","1.5 dCi"]],
["Renault","Symbol",["1.2 16V","1.4 8V","1.6 16V","1.5 dCi"]],
["Renault","Logan",["1.4","1.6 8V","1.6 16V","1.5 dCi"]],
["Renault","Sandero",["1.4","1.6 8V","1.6 16V","1.5 dCi"]],
["Renault","Sandero Stepway",["1.6 8V","1.6 16V","1.5 dCi"]],
["Renault","Megane 2",["1.4 16V","1.6 16V","1.5 dCi","1.9 dCi"]],
["Renault","Kangoo",["1.2 16V","1.4","1.5 dCi","1.9 d"]],
["Renault","Duster",["1.6 16V","1.5 dCi"]],
["Peugeot","206",["1.1","1.4","1.6 16V","1.4 HDi"]],
["Peugeot","207",["1.4","1.6 16V","1.4 HDi","1.6 HDi"]],
["Peugeot","208",["1.2 PureTech","1.4 HDi","1.6 HDi"]],
["Peugeot","301",["1.2 VTi","1.6 VTi","1.6 HDi"]],
["Peugeot","307",["1.4","1.6 16V","1.6 HDi","2.0 HDi"]],
["Peugeot","Partner",["1.4","1.6 HDi","1.9 D","2.0 HDi"]],
["Peugeot","Bipper",["1.4 HDi","1.3 HDi"]],
["Peugeot","308",["1.6 VTi","1.6 THP","1.6 HDi","2.0 HDi"]]
];

const parts=[
["Kit embrayage","حسب النسخة / VIN","قابض"],["Plaquettes de frein avant","حسب نظام الفرامل","فرامل"],
["Disques de frein avant","حسب قطر القرص","فرامل"],["Filtre à huile","حسب المحرك","فلاتر"],
["Filtre à air","حسب المحرك","فلاتر"],["Filtre à gasoil","حسب المحرك","فلاتر"],
["Filtre habitacle","حسب السيارة","فلاتر"],["Pompe à eau","حسب المحرك","تبريد"],
["Courroie distribution","حسب المحرك","توزيع"],["Kit distribution","حسب المحرك","توزيع"],
["Courroie alternateur","حسب التجهيز","محرك"],["Thermostat","حسب المحرك","تبريد"],
["Bougies","حسب المحرك","إشعال"],["Injecteur","حسب المحرك","حقن"],
["Joint spi vilebrequin","حسب المحرك","محرك"],["Joint de culasse","حسب المحرك","محرك"],
["Roulement arrière","حسب المحور / ABS","تعليق"],["Triangle suspension","حسب السيارة","تعليق"],
["Amortisseur avant","حسب السيارة","تعليق"],["Silentbloc","حسب القطعة","تعليق"],
["Biellette stabilisatrice","حسب السيارة","تعليق"],["Rotule direction","حسب السيارة","توجيه"],
["Crémaillère","حسب النسخة","توجيه"],["Capteur PMH","حسب المحرك","حساسات"],
["Capteur température","حسب المحرك","حساسات"],["Alternateur","حسب الأمبير","كهرباء"],
["Démarreur","حسب المحرك","كهرباء"],["Batterie","حسب السعة","كهرباء"],
["Feu arrière","حسب السيارة","إضاءة"],["Optique avant","حسب السيارة","إضاءة"]
];

let data=[];
vehicles.forEach(v=>parts.forEach(p=>data.push({brand:v[0],car:v[1],engines:v[2],name:p[0],ref:p[1],type:p[2]})));

const brand=document.getElementById("brand"),car=document.getElementById("car"),engine=document.getElementById("engine"),q=document.getElementById("q");

function fillCars(){
let b=brand.value;car.innerHTML='<option value="">كل السيارات</option>';
[...new Set(vehicles.filter(v=>!b||v[0]===b).map(v=>v[1]))].forEach(x=>car.innerHTML+=`<option>${x}</option>`);
fillEngines();
}
function fillEngines(){
let b=brand.value,c=car.value;engine.innerHTML='<option value="">كل المحركات</option>';
[...new Set(vehicles.filter(v=>(!b||v[0]===b)&&(!c||v[1]===c)).flatMap(v=>v[2]))].forEach(x=>engine.innerHTML+=`<option>${x}</option>`);
}
brand.onchange=fillCars;car.onchange=fillEngines;

function render(){
let b=brand.value,c=car.value,e=engine.value,s=q.value.trim().toLowerCase();
let out=data.filter(x=>(!b||x.brand===b)&&(!c||x.car===c)&&(!e||x.engines.includes(e))&&(!s||[x.brand,x.car,x.engines.join(" "),x.name,x.ref,x.type].join(" ").toLowerCase().includes(s)));
document.getElementById("count").textContent=out.length+" نتيجة";
document.getElementById("results").innerHTML=out.length?out.map(x=>{
let msg=`السلام عليكم BK AUTO، أريد الاستفسار عن ${x.name} لسيارة ${x.brand} ${x.car} بمحرك ${x.engines.join(" / ")}. المرجع: ${x.ref}`;
return <article class="card"><span class="badge">${x.type}</span><h3>${x.name}</h3><div class="meta"><b>${x.brand} ${x.car}</b><br>المحركات: ${x.engines.join(" • ")}</div><div class="ref">REF: ${x.ref}</div><a class="whatsapp" target="_blank" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}">طلب عبر WhatsApp</a></article>;
}).join(""):'<div class="empty">لم نجد نتيجة. جرّب تغيير السيارة أو المحرك أو كلمة البحث.</div>';
}
function resetAll(){brand.value="";q.value="";fillCars();render()}
fillCars();render();
</script>
</body>
</html>'''
