<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BK AUTO | كتالوج قطع غيار السيارات</title>

<meta name="description"
content="BK AUTO - كتالوج قطع غيار السيارات Renault Peugeot Dacia في الجزائر">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#0b0b0d;
    color:#fff;
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    background:#111116;
    border-bottom:1px solid #25252b;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:900;
}

.logo span{
    color:#e4002b;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}

nav a:hover{
    color:#e4002b;
}

/* ================= HERO ================= */

.hero{
    text-align:center;
    padding:70px 20px 45px;
    background:
    radial-gradient(circle at center,#24242c 0%,#0b0b0d 65%);
}

.hero h1{
    font-size:58px;
    font-weight:900;
    letter-spacing:1px;
}

.hero h1 span{
    color:#e4002b;
}

.hero h2{
    margin-top:15px;
    font-size:25px;
}

.hero p{
    margin-top:12px;
    color:#bbb;
    font-size:16px;
}

.brands{
    margin-top:18px;
    font-size:18px;
    color:#ddd;
}

/* ================= SEARCH ================= */

.search-area{
    width:94%;
    max-width:1250px;
    margin:0 auto;
    transform:translateY(10px);
    background:#fff;
    border-radius:18px;
    padding:14px;
    box-shadow:0 15px 50px rgba(0,0,0,.45);
}

.search-grid{
    display:grid;
    grid-template-columns:1.6fr 1fr 1fr 1fr auto auto;
    gap:10px;
}

input,
select{
    width:100%;
    height:52px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 15px;
    font-size:15px;
    outline:none;
    background:#fff;
    color:#222;
}

input:focus,
select:focus{
    border-color:#e4002b;
    box-shadow:0 0 0 2px rgba(228,0,43,.1);
}

button{
    border:0;
    border-radius:12px;
    padding:0 20px;
    height:52px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.search-btn{
    background:#e4002b;
    color:#fff;
}

.reset-btn{
    background:#202126;
    color:#fff;
}

/* ================= COUNT ================= */

.count-box{
    width:94%;
    max-width:1250px;
    margin:45px auto 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.count{
    background:#e4002b;
    padding:9px 18px;
    border-radius:30px;
    font-weight:bold;
}

.section-title{
    font-size:25px;
    font-weight:bold;
}

.section-title span{
    color:#e4002b;
}

/* ================= CARDS ================= */

.catalog{
    width:94%;
    max-width:1250px;
    margin:20px auto 70px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:#151519;
    border:1px solid #29292f;
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.card:hover{
    transform:translateY(-5px);
    border-color:#e4002b;
    box-shadow:0 12px 35px rgba(228,0,43,.12);
}

.card-top{
    padding:20px;
    border-bottom:1px solid #29292f;
}

.part-name{
    font-size:21px;
    font-weight:bold;
    margin-bottom:14px;
}

.info{
    display:grid;
    gap:8px;
}

.info div{
    color:#bbb;
}

.info strong{
    color:#fff;
}

.ref{
    margin-top:15px;
    background:#0d0d10;
    border-radius:10px;
    padding:12px;
    color:#e4002b;
    font-weight:bold;
}

.card-bottom{
    padding:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.call-btn,
.whatsapp-btn{
    height:46px;
    border-radius:10px;
    color:#fff;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.call-btn{
    background:#222329;
}

.whatsapp-btn{
    background:#168c48;
}

.call-btn:hover{
    background:#33343b;
}

.whatsapp-btn:hover{
    background:#1aa854;
}

/* ================= EMPTY ================= */

.empty{
    width:94%;
    max-width:800px;
    margin:50px auto;
    text-align:center;
    padding:50px 20px;
    background:#151519;
    border-radius:18px;
    border:1px solid #29292f;
}

.empty h3{
    font-size:25px;
    margin-bottom:10px;
}

.empty p{
    color:#aaa;
}

/* ================= FOOTER ================= */

footer{
    background:#111116;
    border-top:1px solid #29292f;
    text-align:center;
    padding:30px 15px;
    color:#aaa;
}

footer strong{
    color:#e4002b;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){

    .search-grid{
        grid-template-columns:1fr 1fr;
    }

    .catalog{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    header{
        padding:15px 20px;
    }

    nav{
        gap:12px;
        font-size:13px;
    }

    .logo{
        font-size:22px;
    }

    .hero{
        padding:50px 15px 35px;
    }

    .hero h1{
        font-size:40px;
    }

    .hero h2{
        font-size:20px;
    }

    .search-grid{
        grid-template-columns:1fr;
    }

    .search-area{
        width:92%;
    }

    .count-box{
        width:92%;
        margin-top:40px;
    }

    .catalog{
        width:92%;
        grid-template-columns:1fr;
    }

    .section-title{
        font-size:20px;
    }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        BK <span>AUTO</span>
    </div>

    <nav>
        <a href="#">الرئيسية</a>
        <a href="#catalog">الكتالوج</a>
        <a href="#contact">اتصل بنا</a>
    </nav>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <h1>
        BK <span>AUTO</span>
    </h1>

    <h2>
        كتالوج قطع غيار السيارات
    </h2>

    <div class="brands">
        Renault • Peugeot • Dacia
    </div>

    <p>
        ابحث باسم القطعة أو السيارة أو المحرك أو رقم المرجع
    </p>

</section>


<!-- ================= SEARCH ================= -->

<section class="search-area">

    <div class="search-grid">

        <input
            id="searchInput"
            type="text"
            placeholder="اسم القطعة أو السيارة أو رقم المرجع..."
        >

        <select id="brandSelect">
            <option value="">كل الماركات</option>
        </select>

        <select id="modelSelect">
            <option value="">كل السيارات</option>
        </select>

        <select id="engineSelect">
            <option value="">كل المحركات</option>
        </select>

        <button
            class="search-btn"
            onclick="searchParts()">
            🔎 بحث
        </button>

        <button
            class="reset-btn"
            onclick="resetSearch()">
            إعادة ضبط
        </button>

    </div>

</section>


<!-- ================= COUNT ================= -->

<div class="count-box">

    <div class="section-title">
        كتالوج <span>قطع الغيار</span>
    </div>

    <div class="count">
        <span id="count">0</span> قطعة
    </div>

</div>


<!-- ================= CATALOG ================= -->

<main id="catalog" class="catalog"></main>


<!-- ================= FOOTER ================= -->

<footer id="contact">

    <p>
        <strong>BK AUTO</strong>
        - قطع غيار السيارات
    </p>

    <p style="margin-top:10px;">
        📞 0556419934
    </p>

    <p style="margin-top:10px;">
        Renault • Peugeot • Dacia
    </p>

</footer>


<script>

/* =========================================================
   بيانات قطع الغيار
   أضف القطع الجديدة داخل هذه القائمة
========================================================= */

const parts = [

    {
        brand:"Peugeot",
        model:"206",
        engine:"Essence 1.4",
        name:"Pompe à eau",
        ref:"1201.A1"
    },

    {
        brand:"Peugeot",
        model:"Bipper",
        engine:"HDI 1.4",
        name:"Joint guide soupape",
        ref:"1654507180"
    },

    {
        brand:"Dacia",
        model:"Stepway",
        engine:"1.6 Essence",
        name:"Kit embrayage",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Symbol",
        engine:"1.2 16V",
        name:"Pompe à eau",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Logan",
        engine:"1.6 Essence",
        name:"Kit embrayage",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Clio",
        engine:"1.2 16V",
        name:"Joint spi vilebrequin",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Clio",
        engine:"1.9 D",
        name:"Kit embrayage",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Kangoo",
        engine:"1.9 D",
        name:"Joint spi vilebrequin",
        ref:"80.105.8"
    },

    {
        brand:"Renault",
        model:"Kangoo",
        engine:"1.5 dCi",
        name:"Kit embrayage",
        ref:"-"
    },

    {
        brand:"Peugeot",
        model:"208",
        engine:"1.6 HDI",
        name:"Kit embrayage",
        ref:"-"
    },

    {
        brand:"Peugeot",
        model:"301",
        engine:"1.6 HDI",
        name:"Jauge huile",
        ref:"-"
    },

    {
        brand:"Peugeot",
        model:"301",
        engine:"1.6 VTi",
        name:"Jauge huile",
        ref:"-"
    },

    {
        brand:"Peugeot",
        model:"207",
        engine:"1.6 HDI",
        name:"Kit embrayage",
        ref:"302052617R"
    },

    {
        brand:"Dacia",
        model:"Stepway",
        engine:"1.6 Essence",
        name:"Pompe à eau",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Symbol",
        engine:"1.6 Essence",
        name:"Kit embrayage",
        ref:"-"
    }

];


/* =========================================================
   رقم الهاتف
========================================================= */

const phoneNumber = "0556419934";

const whatsappNumber = "213556419934";


/* =========================================================
   عناصر الصفحة
========================================================= */

const searchInput =
    document.getElementById("searchInput");

const brandSelect =
    document.getElementById("brandSelect");

const modelSelect =
    document.getElementById("modelSelect");

const engineSelect =
    document.getElementById("engineSelect");

const catalog =
    document.getElementById("catalog");

const count =
    document.getElementById("count");


/* =========================================================
   إنشاء القوائم
========================================================= */

function uniqueValues(key){

    return [
        ...new Set(
            parts
            .map(part => part[key])
            .filter(Boolean)
        )
    ].sort();

}


function fillSelect(select, values, defaultText){

    select.innerHTML =
        <option value="">${defaultText}</option>;

    values.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = value;

        select.appendChild(option);

    });

}


function loadFilters(){

    fillSelect(
        brandSelect,
        uniqueValues("brand"),
        "كل الماركات"
    );

    fillSelect(
        modelSelect,
        uniqueValues("model"),
        "كل السيارات"
    );

    fillSelect(
        engineSelect,
        uniqueValues("engine"),
        "كل المحركات"
    );

}


/* =========================================================
   WhatsApp
========================================================= */

function whatsappLink(part){

    const message =
        "السلام عليكم، أريد الاستفسار عن القطعة:%0A%0A" +
        "القطعة: " + part.name +
        "%0Aالماركة: " + part.brand +
        "%0Aالسيارة: " + part.model +
        "%0Aالمحرك: " + part.engine +
        "%0Aالمرجع: " + (part.ref || "-");

    return "https://wa.me/" +
           whatsappNumber +
           "?text=" +
           encodeURIComponent(
               "السلام عليكم، أريد الاستفسار عن القطعة:\n\n" +
               "القطعة: " + part.name + "\n" +
               "الماركة: " + part.brand + "\n" +
               "السيارة: " + part.model + "\n" +
               "المحرك: " + part.engine + "\n" +
               "المرجع: " + (part.ref || "-")
           );

}


/* =========================================================
   عرض القطع
========================================================= */

function displayParts(data){

    catalog.innerHTML = "";

    count.textContent = data.length;


    if(data.length === 0){

        catalog.innerHTML = `

            <div class="empty">

                <h3>لم يتم العثور على القطعة</h3>

                <p>
                    جرّب تغيير البحث أو اختيار سيارة أخرى
                </p>

            </div>

        `;

        return;

    }


    data.forEach(part => {

        const card =
            document.createElement("article");

        card.className = "card";


        card.innerHTML = `

            <div class="card-top">

                <div class="part-name">
                    ${part.name}
                </div>

                <div class="info">

                    <div>
                        الماركة:
                        <strong>${part.brand}</strong>
                    </div>

                    <div>
                        السيارة:
                        <strong>${part.model}</strong>
                    </div>

                    <div>
                        المحرك:
                        <strong>${part.engine}</strong>
                    </div>

                </div>


                <div class="ref">

                    رقم المرجع:
                    ${part.ref || "-"}

                </div>

            </div>


            <div class="card-bottom">

                <a
                    class="call-btn"
                    href="tel:${phoneNumber}">
                    📞 اتصال
                </a>


                <a
                    class="whatsapp-btn"
                    href="${whatsappLink(part)}"
                    target="_blank">
                    💬 WhatsApp
                </a>

            </div>

        `;


        catalog.appendChild(card);

    });

}


/* =========================================================
   البحث
========================================================= */

function searchParts(){

    const search =
        searchInput.value
        .trim()
        .toLowerCase();


    const brand =
        brandSelect.value;

    const model =
        modelSelect.value;

    const engine =
        engineSelect.value;


    const filtered =
        parts.filter(part => {

            const text = (

                part.name + " " +
                part.brand + " " +
                part.model + " " +
                part.engine + " " +
                part.ref

            ).toLowerCase();


            const matchSearch =
                !search ||
                text.includes(search);


            const matchBrand =
                !brand ||
                part.brand === brand;


            const matchModel =
                !model ||
                part.model === model;


            const matchEngine =
                !engine ||
                part.engine === engine;


            return (
                matchSearch &&
                matchBrand &&
                matchModel &&
                matchEngine
            );

        });


    displayParts(filtered);

}


/* =========================================================
   إعادة الضبط
========================================================= */

function resetSearch(){

    searchInput.value = "";

    brandSelect.value = "";

    modelSelect.value = "";

    engineSelect.value = "";

    displayParts(parts);

}


/* =========================================================
   البحث مباشرة أثناء الكتابة
========================================================= */

searchInput.addEventListener(
    "input",
    searchParts
);


/* =========================================================
   تغيير الفلاتر
========================================================= */

brandSelect.addEventListener(
    "change",
    searchParts
);

modelSelect.addEventListener(
    "change",
    searchParts
);

engineSelect.addEventListener(
    "change",
    searchParts
);


/* =========================================================
   تشغيل الموقع
========================================================= */

loadFilters();

displayParts(parts);

</script>

</body>
</html>
