<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BK AUTO | كتالوج قطع غيار السيارات</title>

<meta name="description"
content="BK AUTO - كتالوج قطع غيار السيارات Renault Peugeot Dacia Volkswagen في الجزائر">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        "Tahoma",
        sans-serif;

    background:
        linear-gradient(135deg,#080808,#151515,#080808);

    color:#fff;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    width:100%;
    padding:22px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#090909;
    border-bottom:1px solid rgba(255,255,255,.08);

    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo .bk{
    color:#fff;
}

.logo .auto{
    color:#e90032;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
    transition:.25s;
}

nav a:hover{
    color:#e90032;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:390px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:60px 20px 45px;

    background:
        radial-gradient(
            circle at center,
            rgba(233,0,50,.12),
            transparent 55%
        );
}

.hero-logo{
    font-size:64px;
    font-weight:900;
    letter-spacing:-3px;
    margin-bottom:18px;
}

.hero-logo span{
    color:#e90032;
}

.hero h1{
    font-size:28px;
    margin-bottom:12px;
}

.hero p{
    color:#bcbcbc;
    font-size:17px;
    margin-bottom:8px;
}

.hero .brands{
    color:#e90032;
    font-weight:bold;
}

/* =========================
   SEARCH AREA
========================= */

.search-section{
    width:92%;
    max-width:1250px;

    margin:-10px auto 45px;

    padding:20px;

    background:#fff;

    border-radius:18px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}

.filters{
    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        2fr
        auto;

    gap:12px;

    align-items:center;
}

select,
input{
    width:100%;

    height:52px;

    border:1px solid #ddd;

    border-radius:10px;

    padding:0 16px;

    font-size:15px;

    background:#fafafa;

    color:#222;

    outline:none;
}

select:focus,
input:focus{
    border-color:#e90032;

    box-shadow:
        0 0 0 3px rgba(233,0,50,.1);
}

button{
    border:none;
    cursor:pointer;

    height:52px;

    border-radius:10px;

    padding:0 22px;

    font-size:15px;

    font-weight:bold;

    transition:.25s;
}

.search-btn{
    background:#e90032;
    color:#fff;
}

.search-btn:hover{
    background:#c9002b;
    transform:translateY(-2px);
}

.reset-btn{
    background:#171717;
    color:#fff;
}

.reset-btn:hover{
    background:#333;
}

/* =========================
   RESULT INFO
========================= */

.results-info{
    width:92%;
    max-width:1250px;

    margin:0 auto 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
}

.results-title{
    font-size:22px;
    font-weight:bold;
}

.counter{
    background:#e90032;

    color:#fff;

    padding:8px 16px;

    border-radius:30px;

    font-size:14px;

    font-weight:bold;
}

/* =========================
   PARTS GRID
========================= */

.parts-container{
    width:92%;
    max-width:1250px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    padding-bottom:70px;
}

.part-card{
    background:
        linear-gradient(
            145deg,
            #1d1d1d,
            #101010
        );

    border:1px solid rgba(255,255,255,.07);

    border-radius:16px;

    overflow:hidden;

    transition:.3s;

    box-shadow:
        0 10px 25px rgba(0,0,0,.2);
}

.part-card:hover{
    transform:translateY(-6px);

    border-color:
        rgba(233,0,50,.5);

    box-shadow:
        0 15px 35px rgba(0,0,0,.35);
}

.card-top{
    padding:18px 20px;

    background:
        linear-gradient(
            90deg,
            #e90032,
            #a90025
        );

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    font-size:18px;
    font-weight:900;
}

.model{
    font-size:14px;
    opacity:.9;
}

.card-body{
    padding:22px;
}

.part-name{
    font-size:21px;
    font-weight:900;

    margin-bottom:18px;

    color:#fff;
}

.info-row{
    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:10px 0;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    font-size:14px;
}

.info-row:last-child{
    border-bottom:none;
}

.label{
    color:#999;
}

.value{
    color:#fff;
    font-weight:bold;
    text-align:left;
}

.ref{
    color:#e90032;
    font-family:monospace;
    font-size:15px;
}

.card-footer{
    padding:0 22px 22px;
}

.contact-btn{
    width:100%;

    background:#25d366;

    color:#fff;

    height:46px;

    border-radius:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    font-weight:bold;

    transition:.25s;
}

.contact-btn:hover{
    background:#1ebc59;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    background:#121212;

    border-radius:16px;

    border:1px solid #222;
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

.empty h3{
    font-size:23px;
    margin-bottom:10px;
}

.empty p{
    color:#999;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#050505;

    border-top:1px solid #222;

    padding:35px 20px;

    text-align:center;
}

.footer-logo{
    font-size:28px;
    font-weight:900;
    margin-bottom:12px;
}

.footer-logo span{
    color:#e90032;
}

footer p{
    color:#888;
    margin-bottom:10px;
}

.phone{
    color:#e90032;
    font-size:20px;
    font-weight:bold;

    text-decoration:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){

    .filters{
        grid-template-columns:
            1fr 1fr;
    }

    .filters input{
        grid-column:1/-1;
    }

    .parts-container{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:650px){

    header{
        padding:18px 20px;
    }

    nav{
        gap:15px;
    }

    nav a{
        font-size:13px;
    }

    .logo{
        font-size:24px;
    }

    .hero{
        min-height:330px;
        padding-top:45px;
    }

    .hero-logo{
        font-size:48px;
    }

    .hero h1{
        font-size:22px;
    }

    .hero p{
        font-size:14px;
    }

    .search-section{
        width:94%;
        padding:15px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .filters input{
        grid-column:auto;
    }

    .results-info{
        width:94%;
    }

    .results-title{
        font-size:18px;
    }

    .parts-container{
        width:94%;

        grid-template-columns:1fr;

        gap:15px;
    }

}

/* =========================
   ANIMATION
========================= */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.part-card{
    animation:fadeIn .35s ease;
}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        <span class="bk">BK</span>
        <span class="auto">AUTO</span>
    </div>

    <nav>
        <a href="#home">الرئيسية</a>
        <a href="#catalog">الكتالوج</a>
        <a href="#contact">اتصل بنا</a>
    </nav>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero" id="home">

    <div class="hero-logo">
        BK <span>AUTO</span>
    </div>

    <h1>كتالوج قطع غيار السيارات</h1>

    <p>
        ابحث عن القطعة حسب السيارة أو المحرك أو رقم المرجع
    </p>

    <p class="brands">
        Renault • Peugeot • Dacia • Volkswagen
    </p>

</section>


<!-- =========================
     SEARCH
========================= -->

<section class="search-section" id="catalog">

    <div class="filters">

        <select id="brandSelect">
            <option value="">كل الماركات</option>
        </select>

        <select id="modelSelect">
            <option value="">كل السيارات</option>
        </select>

        <select id="engineSelect">
            <option value="">كل المحركات</option>
        </select>

        <input
            type="text"
            id="searchInput"
            placeholder="اسم القطعة أو السيارة أو رقم المرجع..."
        >

        <button
            class="search-btn"
            id="searchBtn"
        >
            🔍 بحث
        </button>

        <button
            class="reset-btn"
            id="resetBtn"
        >
            إعادة ضبط
        </button>

    </div>

</section>


<!-- =========================
     RESULTS
========================= -->

<div class="results-info">

    <div class="results-title">
        كتالوج قطع الغيار
    </div>

    <div class="counter" id="counter">
        0 قطعة
    </div>

</div>


<!-- =========================
     PARTS
========================= -->

<main
    class="parts-container"
    id="partsContainer">
</main>


<!-- =========================
     FOOTER
========================= -->

<footer id="contact">

    <div class="footer-logo">
        BK <span>AUTO</span>
    </div>

    <p>
        قطع غيار السيارات
    </p>

    <p>
        Renault • Peugeot • Dacia • Volkswagen
    </p>

    <a
        class="phone"
        href="tel:0556419934"
    >
        📞 0556419934
    </a>

</footer>


<script>

/* =====================================================
   DATABASE - قطع الغيار
===================================================== */

const parts = [

    {
        brand:"Peugeot",
        model:"206",
        engine:"Essence 1.4",
        name:"Pompe à eau",
        ref:"1201.A1"
    },

    {
        brand:"Peugeot",
        model:"Bipper",
        engine:"HDI 1.4",
        name:"Joint guide soupape",
        ref:"1654507180"
    },

    {
        brand:"Dacia",
        model:"Stepway",
        engine:"1.6 Essence",
        name:"Kit embrayage",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Symbol",
        engine:"1.2 16V",
        name:"Joint spi vilebrequin",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Logan",
        engine:"1.6 Essence",
        name:"Kit embrayage",
        ref:"302052617R"
    },

    {
        brand:"Renault",
        model:"Clio",
        engine:"1.2 16V",
        name:"Pompe à eau",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Kangoo",
        engine:"1.9 D",
        name:"Joint spi vilebrequin",
        ref:"80.105.8"
    },

    {
        brand:"Renault",
        model:"Kangoo",
        engine:"1.5 dCi",
        name:"Kit embrayage",
        ref:"-"
    },

    {
        brand:"Peugeot",
        model:"208",
        engine:"1.6 HDI",
        name:"Kit embrayage",
        ref:"-"
    },

    {
        brand:"Peugeot",
        model:"301",
        engine:"1.6 HDI",
        name:"Jauge huile",
        ref:"-"
    },

    {
        brand:"Peugeot",
        model:"301",
        engine:"1.6 VTi",
        name:"Jauge huile",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Clio 4",
        engine:"1.5 dCi",
        name:"Plaquettes de frein",
        ref:"-"
    },

    {
        brand:"Renault",
        model:"Megane 2",
        engine:"1.5 dCi",
        name:"Roulement arrière",
        ref:"-"
    },

    {
        brand:"Volkswagen",
        model:"Golf 7",
        engine:"2.0 TDI",
        name:"Courroie alternateur",
        ref:"-"
    }

];


/* =====================================================
   ELEMENTS
===================================================== */

const brandSelect =
    document.getElementById("brandSelect");

const modelSelect =
    document.getElementById("modelSelect");

const engineSelect =
    document.getElementById("engineSelect");

const searchInput =
    document.getElementById("searchInput");

const searchBtn =
    document.getElementById("searchBtn");

const resetBtn =
    document.getElementById("resetBtn");

const partsContainer =
    document.getElementById("partsContainer");

const counter =
    document.getElementById("counter");


/* =====================================================
   NORMALIZE TEXT
===================================================== */

function normalizeText(value){

    return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();

}


/* =====================================================
   UNIQUE VALUES
===================================================== */

function uniqueValues(array){

    return [
        ...new Set(
            array
                .filter(Boolean)
                .map(String)
        )
    ].sort(
        (a,b)=>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );

}


/* =====================================================
   FILL SELECT
===================================================== */

function fillSelect(
    select,
    values,
    defaultText
){

    const oldValue = select.value;

    select.innerHTML = "";

    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
        defaultText;

    select.appendChild(defaultOption);

    values.forEach(value=>{

        const option =
            document.createElement("option");

        option.value = value;

        option.textContent = value;

        select.appendChild(option);

    });

    if(values.includes(oldValue)){
        select.value = oldValue;
    }

}


/* =====================================================
   UPDATE BRAND
===================================================== */

function updateBrandSelect(){

    const brands =
        uniqueValues(
            parts.map(
                part => part.brand
            )
        );

    fillSelect(
        brandSelect,
        brands,
        "كل الماركات"
    );

}


/* =====================================================
   UPDATE MODEL
===================================================== */

function updateModelSelect(){

    const selectedBrand =
        brandSelect.value;

    let filteredParts = parts;

    if(selectedBrand){

        filteredParts =
            parts.filter(
                part =>
                    part.brand === selectedBrand
            );

    }

    const models =
        uniqueValues(
            filteredParts.map(
                part => part.model
            )
        );

    fillSelect(
        modelSelect,
        models,
        "كل السيارات"
    );

}


/* =====================================================
   UPDATE ENGINE
===================================================== */

function updateEngineSelect(){

    const selectedBrand =
        brandSelect.value;

    const selectedModel =
        modelSelect.value;

    let filteredParts = parts;

    if(selectedBrand){

        filteredParts =
            filteredParts.filter(
                part =>
                    part.brand === selectedBrand
            );

    }

    if(selectedModel){

        filteredParts =
            filteredParts.filter(
                part =>
                    part.model === selectedModel
            );

    }

    const engines =
        uniqueValues(
            filteredParts.map(
                part => part.engine
            )
        );

    fillSelect(
        engineSelect,
        engines,
        "كل المحركات"
    );

}


/* =====================================================
   GET FILTERED PARTS
===================================================== */

function getFilteredParts(){

    const brand =
        normalizeText(
            brandSelect.value
        );

    const model =
        normalizeText(
            modelSelect.value
        );

    const engine =
        normalizeText(
            engineSelect.value
        );

    const search =
        normalizeText(
            searchInput.value
        );


    return parts.filter(part=>{

        const matchesBrand =
            !brand ||
            normalizeText(part.brand) === brand;


        const matchesModel =
            !model ||
            normalizeText(part.model) === model;


        const matchesEngine =
            !engine ||
            normalizeText(part.engine) === engine;


        const searchableText =
            [
                part.brand,
                part.model,
                part.engine,
                part.name,
                part.ref
            ]
            .map(normalizeText)
            .join(" ");


        const matchesSearch =
            !search ||
            searchableText.includes(search);


        return (
            matchesBrand &&
            matchesModel &&
            matchesEngine &&
            matchesSearch
        );

    });

}


/* =====================================================
   RENDER PARTS
===================================================== */

function renderParts(){

    const filtered =
        getFilteredParts();

    partsContainer.innerHTML = "";

    counter.textContent =
        ${filtered.length} قطعة;


    if(filtered.length === 0){

        partsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    لم يتم العثور على قطع
                </h3>

                <p>
                    جرّب تغيير البحث أو اختيار "الكل"
                </p>

            </div>

        `;

        return;
    }


    filtered.forEach(part=>{

        const card =
            document.createElement("article");

        card.className =
            "part-card";


        const whatsappText =
            encodeURIComponent(
                `السلام عليكم، أريد الاستفسار عن:
${part.name}
السيارة: ${part.brand} ${part.model}
المحرك: ${part.engine}
المرجع: ${part.ref}`
            );


        card.innerHTML = `

            <div class="card-top">

                <div class="brand">
                    ${escapeHTML(part.brand)}
                </div>

                <div class="model">
                    ${escapeHTML(part.model)}
                </div>

            </div>


            <div class="card-body">

                <div class="part-name">
                    ${escapeHTML(part.name)}
                </div>


                <div class="info-row">

                    <span class="label">
                        السيارة
                    </span>

                    <span class="value">
                        ${escapeHTML(part.model)}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        المحرك
                    </span>

                    <span class="value">
                        ${escapeHTML(part.engine)}
                    </span>

                </div>


                <div class="info-row">

                    <span class="label">
                        المرجع
                    </span>

                    <span class="value ref">
                        ${escapeHTML(part.ref)}
                    </span>

                </div>

            </div>


            <div class="card-footer">

                <a
                    class="contact-btn"
                    href="https://wa.me/213556419934?text=${whatsappText}"
                    target="_blank"
                    rel="noopener"
                >
                    💬 استفسر عن القطعة
                </a>

            </div>

        `;


        partsContainer.appendChild(card);

    });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   EVENTS
===================================================== */

brandSelect.addEventListener(
    "change",
    ()=>{

        updateModelSelect();

        updateEngineSelect();

        renderParts();

    }
);


modelSelect.addEventListener(
    "change",
    ()=>{

        updateEngineSelect();

        renderParts();

    }
);


engineSelect.addEventListener(
    "change",
    renderParts
);


searchBtn.addEventListener(
    "click",
    renderParts
);


searchInput.addEventListener(
    "input",
    renderParts
);


searchInput.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Enter"){
            renderParts();
        }

    }
);


resetBtn.addEventListener(
    "click",
    ()=>{

        brandSelect.value = "";

        modelSelect.value = "";

        engineSelect.value = "";

        searchInput.value = "";

        updateModelSelect();

        updateEngineSelect();

        renderParts();

    }
);


/* =====================================================
   START APPLICATION
===================================================== */

updateBrandSelect();

updateModelSelect();

updateEngineSelect();

renderParts();

</script>

</body>
